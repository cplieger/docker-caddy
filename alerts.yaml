# Recommended alert rules for docker-caddy. Prometheus / Mimir ruler (PromQL)
# rule group. Every rule reads a series from the admin API's /metrics endpoint
# (http://localhost:2019/metrics by default), which is permanently mounted on
# the admin endpoint, so the baseline for all of them is keeping the admin API
# on and scraping it. The two bundled plugins differ, so each gets its own
# reason. The bouncer registers no series unless `enable_caddy_metrics` is set
# in the `crowdsec` global block — the shipped Caddyfile.plugins.example sets
# it — and with it set its LAPI counters land in the registry the admin
# /metrics endpoint serves, which is what CrowdSecBouncerLAPIFailing below
# reads. Only the fail-open VERDICT stays unscrapeable: that lives at POST
# /crowdsec/health (see the README). The cloudflare DNS-01 plugin has no rule
# because Caddy registers no certificate, ACME or expiry series at all, so a
# renewal that stops working is invisible at this endpoint by any rule; detect
# it from outside with a TLS prober against the served site
# (blackbox_exporter's probe_ssl_earliest_cert_expiry).
# CaddyConfigReloadFailed and CaddyUpstreamUnhealthy need no Caddyfile option at
# all: their metrics are registered unconditionally. CaddyUpstreamUnhealthy does
# additionally require active or passive health checks configured on the
# `reverse_proxy` (`fail_duration` is enough for passive; Caddy performs none by
# default), without which its series stays at 1 and the rule cannot fire.
# CaddyHigh5xxRate is the one rule that needs the `metrics` global option,
# because that option is what registers the HTTP per-request instrumentation it
# reads. It is an aggregate ratio over whatever labels the scrape attached, so a
# single failing vhost among many will not reach 5% of its target's total request
# rate; `metrics { per_host }` adds the `host` label, which the expression
# preserves automatically and which turns the rule per-vhost, at the cardinality
# and memory cost Caddy's own documentation for the option names.
# Thresholds, `for:` windows, and the severity labels are starting points; adjust
# them to your deployment. The scrape `job` label is yours to set, so it is
# intentionally left out of the selectors.
groups:
  - name: caddy
    rules:
      - alert: CaddyUpstreamUnhealthy
        expr: caddy_reverse_proxy_upstreams_healthy == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Caddy upstream {{ $labels.upstream }} unhealthy"
          description: >
            Caddy reports {{ $labels.upstream }} as down for >5m; the fronted
            service is likely failing. Cross-check the backend container.
      - alert: CaddyConfigReloadFailed
        expr: caddy_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Caddy config reload failed"
          description: >
            caddy_config_last_reload_successful=0; a config reload was applied
            and rejected, so the running config is the previous one. Validate
            the Caddyfile (caddy validate) and check for a bad config reload.
            Note this gauge moves only when Caddy attempts to apply a config
            in-process. A Caddyfile that fails to ADAPT leaves it at 1, which
            is where both `caddy reload` and an opted-in `--watch` fail, so a
            stale running config is not covered.
      - alert: CaddyHigh5xxRate
        expr: >
          sum without (server, handler, code, method) (rate(caddy_http_request_duration_seconds_count{code=~"5.."}[5m]))
          / sum without (server, handler, code, method) (rate(caddy_http_request_duration_seconds_count[5m])) > 0.05
          and sum without (server, handler, code, method) (rate(caddy_http_request_duration_seconds_count[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Caddy 5xx rate >5%"
          description: >
            More than 5% of responses are 5xx over 10m (at >1 req/s). Indicates
            upstream failures or a broken route; correlate with
            CaddyUpstreamUnhealthy and the backend logs.
      - alert: CrowdSecBouncerLAPIFailing
        expr: >
          rate(crowdsec_bouncer_lapi_requests_failures_total{mode="stream"}[10m])
          / rate(crowdsec_bouncer_lapi_requests_total{mode="stream"}[10m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec bouncer cannot reach the LAPI"
          description: >
            More than half of the bouncer's decision-stream polls have been failing
            for >5m, so its cached decision list is stale and, unless
            `enable_hard_fails` is set, flagged IPs are served unblocked. The proxy
            keeps serving and the healthcheck stays green throughout, so this is the
            shipped bundle's only automatic signal for the outage; the fail-open
            VERDICT itself is readable only at POST /crowdsec/health, which a scrape
            cannot read. Needs `enable_caddy_metrics` in the `crowdsec` global block,
            which the shipped example sets. Check the CrowdSec LAPI and the bouncer's
            `api_url` and `api_key`.

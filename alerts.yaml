# Recommended alert rules for docker-caddy. MIXED rule group: four rules are
# PromQL and two are LogQL, because Caddy carries its operational state in two
# places and a condition with no series still has a log line.
#
# The four PromQL rules read series from the admin API's /metrics endpoint
# (http://localhost:2019/metrics by default), which is permanently mounted on
# the admin endpoint, so the baseline for all of them is keeping the admin API
# on and scraping it with Prometheus or the Mimir ruler. Beyond that baseline,
# three of the four have a prerequisite of their own, stated below with whether
# the shipped Caddyfile.plugins.example already satisfies it: it satisfies two
# of the three, and the one it does not is health checks on the
# `reverse_proxy`.
# CaddyConfigReloadFailed needs no Caddyfile option at all: its metric is
# registered unconditionally.
# CaddyUpstreamUnhealthy registers its metric unconditionally too, but requires
# active or passive health checks configured on the `reverse_proxy`
# (`fail_duration <duration>` is enough for passive, with the argument: the bare
# option name yields a Caddyfile that fails to adapt, and Caddy performs no
# health checks by default), without which its series stays at 1 and the rule
# cannot fire. This is the one prerequisite the shipped example does NOT
# satisfy, and the example says so at its `reverse_proxy` line.
# CaddyHigh5xxRate is the one rule that needs the `metrics` global option,
# because that option is what registers the HTTP per-request instrumentation it
# reads; the shipped example sets it, and the comment at that line states the
# throughput cost of keeping it. It is an aggregate ratio over whatever labels
# the scrape attached, so a single failing vhost among many will not reach 5% of
# its target's total request rate; `metrics { per_host }` adds the `host` label,
# which the expression preserves automatically and which turns the rule
# per-vhost, at the cardinality and memory cost Caddy's own documentation for
# the option names.
# CaddyCrowdSecLAPIFailing reads the bouncer's LAPI counters, and the bouncer
# registers no series at all unless `enable_caddy_metrics` is set in the
# `crowdsec` global block, which the shipped example sets. With it set, those
# counters land in the registry the admin /metrics endpoint serves. No surface
# in this bundle reports the fail-open VERDICT: what the bundle detects is the
# LAPI outage that causes it, and the admin API's POST /crowdsec/health is a
# LAPI REACHABILITY check rather than a verdict read, since it pings the LAPI
# through the live bouncer and inspects no decision.
#
# The two LogQL rules (CaddyCertIssuanceFailed, CaddyCrowdSecLAPIPollFailed)
# read the container's log stream, because their condition has no series to
# read: Caddy registers no certificate, ACME or expiry series at all, and the
# bouncer's counters need the option above while its log line needs nothing.
# Ship the container's logs to Loki and evaluate those two with Loki's ruler;
# firing alerts deliver through your Alertmanager exactly like the metric ones.
# Their shared prerequisites are the log ENCODING and the log DESTINATION.
# Caddy writes JSON whenever stderr is not an interactive terminal, which is
# the container default, so `| json` parses the stream and the `logger` and
# `level` fields are the selectors (zap's production encoder writes the level
# lowercase, so `level="error"` and never `level="ERROR"`). A global `log`
# block that sends the default logger to a file takes these lines off stderr,
# and then neither rule matches anything, whatever is failing: leave the
# default logger on stderr, or tail that file with your collector.
#
# Detection from OUTSIDE the container is still worth keeping for certificates,
# and it is not redundant with CaddyCertIssuanceFailed: a TLS prober against
# the served site (blackbox_exporter's probe_ssl_earliest_cert_expiry) catches
# the one case that logs nothing, a renewal that is never attempted.
#
# Thresholds, `for:` windows, and the severity labels are starting points; adjust
# them to your deployment. The scrape `job` label is yours to set, so it is
# intentionally left out of the metric selectors, and the `container` selector on
# the two log rules is whatever your log collector sets (Grafana Alloy's Docker
# log discovery sets `container` with no configuration; Promtail and others may
# key on `job` or `service` instead).
groups:
  - name: caddy
    rules:
      - alert: CaddyUpstreamUnhealthy
        expr: caddy_reverse_proxy_upstreams_healthy == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Caddy upstream {{ $labels.upstream }} unhealthy"
          description: >
            Caddy reports {{ $labels.upstream }} as down for >5m; the fronted
            service is likely failing. Cross-check the backend container.
      - alert: CaddyConfigReloadFailed
        expr: caddy_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Caddy config reload failed"
          description: >
            caddy_config_last_reload_successful=0; a config reload was attempted
            and rejected, so the running config is the previous one. Validate
            the Caddyfile (caddy validate) and check for a bad config reload.
            Note this gauge moves only when Caddy attempts to apply a config
            in-process. A Caddyfile that fails to ADAPT leaves it at 1, which
            is where both `caddy reload` and an opted-in `--watch` fail, so a
            stale running config is not covered.
      - alert: CaddyHigh5xxRate
        expr: >
          sum without (server, handler, code, method) (rate(caddy_http_request_duration_seconds_count{code=~"5.."}[5m]))
          / sum without (server, handler, code, method) (rate(caddy_http_request_duration_seconds_count[5m])) > 0.05
          and sum without (server, handler, code, method) (rate(caddy_http_request_duration_seconds_count[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Caddy 5xx rate >5%"
          description: >
            The 5xx share of the last 5 minutes of requests has stayed above 5%
            for 10 minutes, at more than 1 request per second over that same
            5-minute window. Indicates upstream failures or a broken route;
            correlate with CaddyUpstreamUnhealthy and the backend logs.
      - alert: CaddyCrowdSecLAPIFailing
        expr: >
          rate(crowdsec_bouncer_lapi_requests_failures_total{mode="stream"}[10m])
          / rate(crowdsec_bouncer_lapi_requests_total{mode="stream"}[10m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec bouncer cannot reach the LAPI"
          description: >
            More than half of the bouncer's decision-stream polls have been failing
            for >5m, so it is learning nothing further from the LAPI. What
            enforcement survives depends on the cache. With a warm cache, which is
            every case except an outage starting before the first stream response,
            the decisions already cached keep being enforced for as long as the
            outage lasts, while no new decision is learned and no expiry is
            applied, so the enforced list silently ages. With a cold cache, an
            outage that begins before that first response, nothing is enforced.
            With `enable_hard_fails` set, the process fails requests rather than
            serving them. The proxy keeps serving and the healthcheck stays green
            throughout, so this rule is the shipped bundle's signal for the outage;
            the admin API's POST /crowdsec/health is an alternative reachability
            check. Needs `enable_caddy_metrics` in the `crowdsec` global block,
            which the shipped example sets. Check the CrowdSec LAPI and the
            bouncer's `api_url` and `api_key`.
      - alert: CaddyCertIssuanceFailed
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"} | json
            | logger=~"tls\\.(obtain|renew)" | level="error" [1h]
          )) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Caddy could not get a certificate"
          description: >
            Caddy logged more than 2 certificate errors in an hour, so an
            issuance or a renewal is failing. The `tls.renew` logger carries a
            renewal and `tls.obtain` a first issuance; the lines are `could not
            get certificate from issuer` once per issuer per attempt, then
            either `will retry` or `final attempt; giving up`. One failed
            attempt with one issuer logs 2 lines, which is what the threshold
            of 2 excludes, so the rule needs a second attempt; Caddy retries on
            an escalating backoff for up to 30 days and the second attempt
            comes one minute after the first. Raise the threshold, or lengthen
            the window, if you configure several issuers, because each one logs
            its own line per attempt. Check the DNS-01 credential, the zone,
            and the issuer's own status. On a renewal the serving certificate
            stays valid until it expires, so this fires while the site still
            works. A renewal that is never ATTEMPTED logs nothing and this rule
            cannot see it; an external TLS prober (blackbox_exporter's
            probe_ssl_earliest_cert_expiry) is what covers that case.
      - alert: CaddyCrowdSecLAPIPollFailed
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"} | json
            | logger="crowdsec" | level="error" [10m]
          )) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec bouncer is logging LAPI errors"
          description: >
            The bouncer logged more than 2 errors in 10 minutes. It polls the
            LAPI decision stream every 60s by default and logs one ERROR line
            per failed poll, so a threshold of 2 reaches an unreachable LAPI
            within about 3 minutes while one lost poll stays quiet. The
            selector is the log LEVEL under the `crowdsec` logger rather than a
            message, because the failed poll logs the raw transport error and
            has no stable string; any other repeating bouncer error trips the
            same rule, so read the line. This rule needs no Caddyfile option at
            all, which is what makes it the detector for a deployment that
            leaves `enable_caddy_metrics` off; where it is set,
            CaddyCrowdSecLAPIFailing reports the same outage as a rate. With
            `enable_hard_fails` set the bouncer logs at FATAL and exits
            instead, so the container restart is the signal there, not this
            rule. Consequences for enforcement are the ones
            CaddyCrowdSecLAPIFailing describes. Check the CrowdSec LAPI and the
            bouncer's `api_url` and `api_key`.

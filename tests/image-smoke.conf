# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Do not hand-write tests/image-smoke.sh beside this
# file: it is synced verbatim and a local edit is overwritten.
#
# Health is the baked /probe GET of Caddy's admin API (127.0.0.1:2019/config/),
# which answers wherever Caddy stores state, so smoke_verify carries what
# health cannot. It runs in two parts, in this order.
#
# Part 1 asserts the ASSEMBLY, against the pristine donor default config: the
# DERIVED storage roots (the hand-cloned XDG_CONFIG_HOME / XDG_DATA_HOME ENV
# pair in the Dockerfile), that the assembled image serves the donor's default
# Caddyfile and welcome page on :80, that the /etc/mime.types in the final
# stage is the DONOR's table and not the runtime base's own, and that the
# donor's 1777 state directories reached that stage with their mode. It must
# stay first: the donor default stops answering on :80 once part 2 reloads.
#
# Part 2 asserts the PAYLOAD. Two third-party plugins are compiled into a
# rebuilt caddy on independent upstream clocks, and every other check in this
# repo proves only that they are compiled IN. So the DNS provider is asked to
# provision in the assembled image, and the CrowdSec bouncer gets a REACHABLE
# decision stream, which nothing here has ever given it: the same instance is
# asked to serve a client its list bans and a client it does not, so a bouncer
# that blocks everything fails the first leg and one that enforces nothing
# fails the second. That second case is the one worth the cost, because a
# bouncer that fails open serves the requests it should refuse and reports
# nothing.
#
# Both the decision stream and the proxied upstream are served by the container
# under test to itself, so no peer, no volume and no network are needed and no
# third party is reachable even by accident.
#
# What part 2 does NOT cover: an actual certificate issuance. Driving one needs
# a CA the container can reach, and even against a local one certmagic resolves
# the challenge zone through a recursive resolver before the provider is ever
# called, so the leg would need egress and could then go red with nobody
# touching the code. The runtime trust store is out of reach for the same
# reason. Drift in the bouncer's own wire protocol would fail this test for a
# reason that is not a defect in this image, which is why the failure messages
# below name the bouncer.
#
# The control this design is red-checked with is upstream's own plugin-less
# caddy copied over /usr/bin/caddy in the container under test. That binary
# reports an IDENTICAL version string, so the Dockerfile's donor-contract
# parity stage cannot see a wrong-stage COPY of it, and the DNS provider
# assertion below is what does.
#
# mime.types is asserted by IDENTITY, not presence, because the runtime base
# ships a media-types table at that same path: opening it proves nothing about
# which of the two won the COPY. The donor's Apache table opens with a comment
# the base's Debian table does not carry, and normalising both to sorted type
# names leaves 68 donor-only and 192 base-only types, so which file is in the
# final stage really does change the Content-Type map file_server serves. The
# served Content-Type itself stays unexercised for a reason on the ASSERT side
# rather than the fixture side: the only HTTP client in the image is /probe,
# which reads the status and no header, and the harness publishes no ports.
#
# The two state-directory modes are not equally load-bearing under the shipped
# compose.yaml, which bind-mounts ./data:/data and mounts nothing at /config:
# the bind mount masks the image's /data/caddy, so /config/caddy's baked 1777
# is what an unprivileged process relies on there. The /data half is asserted
# anyway, because a deployment that does not mount /data relies on the image's
# mode for the CERT STORE, which is a larger consequence than a lost autosave.
SMOKE_APP_NAME=caddy
SMOKE_TIMEOUT=90
# Part 2 serves both its peers from the container under test, so the run needs
# no network at all. Removing this re-opens the egress question for every
# assertion below.
SMOKE_RUN_ARGS="--network none"

# Generated rather than committed: the dummy Cloudflare token is built with
# printf so it is never a literal in the tree (tests/smoke.sh does the same for
# gitleaks), and the two decision lists come from one emitter so the allow leg
# and the ban leg cannot drift apart.
SMOKE_FIXTURE=$(mktemp -d)
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_FIXTURE"
}

# $1 is the whole `dns` argument list, so the three fixtures differ only in the
# provider name and the credential.
smoke_emit_dns() {
  cat <<EOF
{
	admin off
}

smoke-caddy.example.com {
	tls {
		dns $1
	}
	respond 200
}
EOF
}

# The banned address is the only difference between the two legs. :8090 is the
# LAPI, :8080 the proxied upstream, and :8080 answers only for the header a
# reverse_proxy hop adds, so a 2xx at the client cannot be produced locally.
smoke_emit_live() {
  cat <<EOF
{
	admin localhost:2019
	order crowdsec first
	crowdsec {
		api_url http://127.0.0.1:8090
		api_key smoke-not-a-real-key
		ticker_interval 1s
	}
}

http://:8090 {
	handle /v1/decisions/stream {
		header Content-Type application/json
		respond \`{"new":[{"duration":"1h","id":1,"origin":"cscli","scenario":"manual","scope":"Ip","type":"ban","value":"$1"}],"deleted":[]}\` 200
	}
	respond 404
}

http://:80 {
	crowdsec
	reverse_proxy 127.0.0.1:8080
}

http://:8080 {
	log
	@viaproxy header X-Forwarded-For *
	respond @viaproxy 200
	respond 418
}
EOF
}

# 203.0.113.0/24 is TEST-NET-3: an address the probing client can never have,
# which is what makes the allow leg an allow leg.
if ! smoke_emit_dns "cloudflare $(printf 'cfut_%032d' 0)" >"$SMOKE_FIXTURE/dns.caddyfile" \
  || ! smoke_emit_dns "smoke-caddy-nosuchprovider $(printf 'cfut_%032d' 0)" \
    >"$SMOKE_FIXTURE/dns-bogus.caddyfile" \
  || ! smoke_emit_dns 'cloudflare not-a-real-token' >"$SMOKE_FIXTURE/dns-badtoken.caddyfile" \
  || ! smoke_emit_live 203.0.113.7 >"$SMOKE_FIXTURE/allow.caddyfile" \
  || ! smoke_emit_live 127.0.0.1 >"$SMOKE_FIXTURE/ban.caddyfile"; then
  printf 'FAIL: could not write the smoke Caddyfile fixtures\n' >&2
  smoke_cleanup
  exit 1
fi

# The json-file log driver can lag the command that caused a line, so every log
# assertion polls to its own bound instead of grepping once.
smoke_wait_log() {
  log_i=0
  while [ "$log_i" -lt 20 ]; do
    if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- "$1"; then
      return 0
    fi
    log_i=$((log_i + 1))
    sleep 1
  done
  return 1
}

# 403 specifically, not "any failure": a routing fault must not read as a block.
smoke_probe_forbidden() {
  probe_out=$(docker exec "$SMOKE_CONTAINER" /probe -timeout 4s \
    http://127.0.0.1:80/smoke-caddy-probe 2>&1) || true
  case "$probe_out" in
    *403*) return 0 ;;
  esac
  return 1
}

smoke_verify() {
  smoke_verify_assembly
  smoke_verify_payload
}

# `caddy environ` prints the derived roots, so this checks the hand-cloned XDG
# env rather than the ENV lines' presence. The harness publishes no ports, so
# both probes run inside the container. The harness reports only a generic
# failure verdict, so each assertion names its own reason on stderr.
smoke_verify_assembly() {
  derived=$(docker exec "$SMOKE_CONTAINER" /usr/bin/caddy environ) || {
    printf 'FAIL: caddy environ did not run in the assembled image\n' >&2
    return 1
  }
  printf '%s\n' "$derived" | grep -qF 'caddy.AppDataDir=/data/caddy' || {
    printf 'FAIL: derived data root is not /data/caddy; caddy environ printed:\n%s\n' \
      "$derived" >&2
    return 1
  }
  printf '%s\n' "$derived" | grep -qF 'caddy.AppConfigDir=/config/caddy' || {
    printf 'FAIL: derived config root is not /config/caddy; caddy environ printed:\n%s\n' \
      "$derived" >&2
    return 1
  }
  docker exec "$SMOKE_CONTAINER" /probe -timeout 4s http://127.0.0.1:80/ || {
    printf 'FAIL: the donor default Caddyfile does not serve the welcome page on :80\n' >&2
    return 1
  }
  docker cp "$SMOKE_CONTAINER:/etc/mime.types" - \
    | tar -xOf - \
    | grep -qF 'I love comments' || {
    printf 'FAIL: /etc/mime.types is the runtime base table, not the donor table\n' >&2
    return 1
  }
  # Anchored on the directory's own name: an unanchored match is satisfied by
  # any 1777 entry in the tar, so a 1777 child would keep it green while
  # caddy/ itself lost the mode.
  for state_dir in /config/caddy /data/caddy; do
    docker cp "$SMOKE_CONTAINER:$state_dir" - \
      | tar -tvf - \
      | grep -qE '^drwxrwxrwt .* caddy/$' || {
      printf 'FAIL: %s is not mode 1777 in the assembled image\n' "$state_dir" >&2
      return 1
    }
  done
}

smoke_verify_payload() {
  for fixture in dns dns-bogus dns-badtoken allow ban; do
    docker cp "$SMOKE_FIXTURE/$fixture.caddyfile" \
      "$SMOKE_CONTAINER:/etc/caddy/$fixture.caddyfile" >/dev/null || {
      printf 'FAIL: could not stage the %s fixture in the container\n' "$fixture" >&2
      return 1
    }
  done

  # validate rather than adapt: adapt only runs the plugin's Caddyfile
  # unmarshaler, while validate provisions the module too. The build-time suite
  # provisions it against the builder stage; this is that same code running in
  # the assembled image, which nothing else here reaches.
  out=$(docker exec "$SMOKE_CONTAINER" /usr/bin/caddy validate \
    --adapter caddyfile --config /etc/caddy/dns.caddyfile 2>&1) || {
    printf 'FAIL: the shipped binary does not load and provision dns.providers.cloudflare:\n%s\n' \
      "$out" >&2
    return 1
  }
  # Two controls, because the line above can go vacuous in two ways. An
  # unregistered provider name must be refused, or the check proves nothing
  # about which provider was resolved; and a malformed credential must be
  # refused, or validate has stopped provisioning and is only parsing. adapt
  # accepts that credential, so this second one really does need validate. Both
  # are keyed on a non-zero exit rather than a message, so an upstream
  # rewording does not turn them green.
  for control in dns-bogus dns-badtoken; do
    if docker exec "$SMOKE_CONTAINER" /usr/bin/caddy validate \
      --adapter caddyfile --config "/etc/caddy/$control.caddyfile" >/dev/null 2>&1; then
      printf 'FAIL: validate accepted the %s fixture, so the DNS plugin check above proves nothing\n' \
        "$control" >&2
      return 1
    fi
  done

  # The allow leg. It runs first because it is what stops the ban leg below
  # passing on a bouncer that blocks everything, and because the ban leg leaves
  # the running config banning the prober.
  out=$(docker exec "$SMOKE_CONTAINER" /usr/bin/caddy reload \
    --adapter caddyfile --config /etc/caddy/allow.caddyfile 2>&1) || {
    printf 'FAIL: the running server rejected the crowdsec + reverse_proxy config:\n%s\n' \
      "$out" >&2
    return 1
  }
  # Keyed on the bouncer's own started message, not on the absence of warnings:
  # this bundle ships only the HTTP bouncer, so every provision logs that the
  # layer4 matcher module is unavailable.
  smoke_wait_log '"logger":"crowdsec","msg":"started"' || {
    printf 'FAIL: the CrowdSec bouncer module never started in the shipped image\n' >&2
    return 1
  }
  docker exec "$SMOKE_CONTAINER" /probe -timeout 4s \
    http://127.0.0.1:80/smoke-caddy-probe || {
    printf 'FAIL: no 2xx through crowdsec + reverse_proxy for an unbanned client\n' >&2
    return 1
  }
  smoke_wait_log '"uri":"/smoke-caddy-probe"' || {
    printf 'FAIL: the probed request never reached the proxied upstream listener\n' >&2
    return 1
  }
  # Second witness for that 2xx, single shot because the wait above proved the
  # line is flushed: the upstream logged the probed URI together with the
  # header only a reverse_proxy hop adds, both on ONE line, so no local handler
  # can have produced the answer.
  docker logs "$SMOKE_CONTAINER" 2>&1 \
    | awk 'index($0, "\"uri\":\"/smoke-caddy-probe\"") && index($0, "\"X-Forwarded-For\"") { found = 1 } END { exit !found }' || {
    printf 'FAIL: the upstream saw no X-Forwarded-For, so the 2xx crossed no proxy hop\n' >&2
    return 1
  }

  # The ban leg: same instance, same LAPI, one decision changed. This is the
  # fail-open regression, and the stream is fetched asynchronously, so poll the
  # effect rather than the log.
  out=$(docker exec "$SMOKE_CONTAINER" /usr/bin/caddy reload \
    --adapter caddyfile --config /etc/caddy/ban.caddyfile 2>&1) || {
    printf 'FAIL: the running server rejected the banning decision-stream config:\n%s\n' \
      "$out" >&2
    return 1
  }
  ban_i=0
  while [ "$ban_i" -lt 20 ]; do
    if smoke_probe_forbidden; then
      # Both parts are silent on success, so without this line a run that
      # exercised the plugins is indistinguishable from one whose hook returned
      # early: the harness prints only its own health verdict either way. Name
      # what was proved, so its elapsed time has something to account for.
      printf 'caddy payload: dns.providers.cloudflare provisioned in the assembled image (bogus provider and bad token both refused), and the crowdsec bouncer served an unbanned client through the proxy hop while refusing one its LAPI list bans\n'
      return 0
    fi
    ban_i=$((ban_i + 1))
    sleep 1
  done
  printf 'FAIL: the bouncer served a client its LAPI decision list bans (failing open)\n' >&2
  printf 'last probe output: %s\n' "$probe_out" >&2
  return 1
}

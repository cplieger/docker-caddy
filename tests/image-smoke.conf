# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Health here is the baked /probe GET of Caddy's admin
# API (127.0.0.1:2019/config/), so reaching "healthy" proves the donor COPYs, the
# XDG env clone, /probe and upstream's CMD all hold in the assembled shell-less
# image. No env is needed: the donor ships upstream's default Caddyfile, which
# serves plain :80 with no domain and therefore no ACME. Neither plugin's
# configured path nor the README's /health override is exercised - both need a
# Caddyfile and credentials.
SMOKE_APP_NAME=caddy
SMOKE_TIMEOUT=90

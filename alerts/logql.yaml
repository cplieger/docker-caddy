# Recommended LogQL alert rules for docker-caddy, for Loki's ruler.
# Ship the container's logs to Loki and load this file into Loki's ruler.
# Firing alerts go through your Alertmanager like any Prometheus alert.
# Thresholds, windows and severity labels are starting points. Change the
# container selector to the label your log collector sets.
# Some records these rules read can carry a live Cloudflare API token.
# docs/monitoring.md names them and states what each rule needs.
# The sibling alerts/promql.yaml is for a Prometheus or Mimir ruler.
groups:
  - name: caddy
    rules:
      # Grouped by subject so one certificate's success cannot hide another's
      # failure. Some failure lines name the subject only at the start of their
      # `error` text, so the first label_format reads it from there. A subject
      # it cannot read is empty, matches no success and still fires. The drop
      # stage counts a line the log driver cut short instead of failing the query.
      - alert: CaddyCertManagementFailing
        expr: |
          sum by (container, subject) (count_over_time(
            {container="caddy"} |= `"logger":"tls` != "context canceled" | json
            | level="error"
            | logger=~"tls\\.(obtain|renew)" or (logger="tls" and msg=~"job failed|initiating certificate management")
            | label_format error_subject=`{{ regexReplaceAll "(?s)^(?:\\[([^\\] ]+)\\] |([^ :\\[]+): \\w+ certificate: )?.*" .error "$1$2" }}`
            | label_format subject=`{{ or .identifier .subject .error_subject }}`
            | drop __error__, __error_details__
            [1h]
          ))
          unless on (container, subject)
          sum by (container, subject) (count_over_time(
            {container="caddy"} |~ `certificate (obtained|renewed) successfully`
            | json logger="logger", subject="identifier"
            | logger=~"tls\\.(obtain|renew)"
            [1h]
          ))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Caddy is failing to get or renew a certificate"
          description: >
            Caddy logged a failure such as `could not get certificate from issuer`
            and no success for that certificate in the last hour. A failing
            renewal serves the old certificate until it expires. Read the `error`
            field for the cause.
      - alert: CaddyCrowdSecLAPIPollFailed
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"} | json
            | logger="crowdsec" | level="error" [10m]
          )) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec bouncer is logging LAPI errors"
          description: >
            The CrowdSec bouncer logged more than 2 errors in 10 minutes. It
            logs one per failed LAPI poll, every 60s by default and after a 10s
            retry delay before the first success. Check the LAPI, `api_url` and
            `api_key`.
      - alert: CaddyConfigWatcherStopped
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"} |= "unable to load latest config"
            | json | logger="watcher" [1h]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Caddy stopped watching its config file"
          description: >
            Caddy's `--watch` poller could not read or adapt the config file and
            stopped. Caddy serves the last good config and ignores later edits.
            Fix the cause in the `error` field, then restart the container.

      - alert: CaddyReloadRejected
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"} |= "failed to reload config from file" [1h]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Caddy rejected a config reload it was asked for"
          description: >
            Caddy refused a SIGUSR1 reload, so it still serves the previous
            config and the file on disk is not live. Fix the cause in the
            `error` field, then send the signal again.

      # This rule has no `| json` stage because its first alternative is a
      # plain-text line, and a json parse error would fail the query. Anchoring
      # the second on `"msg":"` keeps it off the reload and watcher records, which
      # carry the same cause text in their `error` field while Caddy keeps serving.
      - alert: CaddyStartupFailed
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"}
            |~ `^Error: |"msg":"(reading config from file|adapting config using [^:"]+|loading initial config): `
            [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Caddy exited during startup"
          description: >
            Caddy exited before serving anything, so every site is down and no
            metric reports it. The line names the cause, such as a module that
            would not provision or an address already in use. Fix it, then
            restart the container.

# Recommended alert rules for docker-caddy, the LogQL half. Loki ruler rule
# group: ship the container's logs to Loki and evaluate these with Loki's
# ruler; firing alerts deliver through your Alertmanager exactly like
# Prometheus metric alerts. One caveat before you choose that store's retention
# and who can read it: a credential a module refuses is printed inside that
# module's own error text, and the bundled Cloudflare DNS plugin prints the token
# it refused, so ANY record reporting a failed config load can carry a live
# Cloudflare API token. At startup that is the cause line CaddyStartupFailed
# selects; on a reload it is the structured `error` field, on
# the `failed to reload config from file` line CaddyReloadRejected selects, on the
# watcher's `applying latest config`, and on the admin API's `request error` -
# the last two reach the store with no rule here selecting them. For
# Caddyfiles using `{env.VAR}`, the adapt arm is the exception: `caddy adapt`
# never resolves that placeholder form, so an `adapting config using caddyfile:`
# cause carries no credential. Treat any token that appears in any of them as
# exposed and rotate it. The sibling
# alerts/promql.yaml carries the rules a Prometheus or Mimir ruler evaluates.
# Load each file into its own ruler: neither ruler parses the other's expressions.
#
# The LogQL rules whose condition registers no series at all
# (CaddyCertManagementFailing,
# CaddyCrowdSecLAPIPollFailed, CaddyConfigWatcherStopped) read the container's
# log stream instead: Caddy registers no
# certificate, ACME or expiry series at all, the bouncer's counters need
# `enable_caddy_metrics` in the `crowdsec` global block while its log line needs
# nothing, and a stopped config watcher never moves the reload gauge. Their
# shared prerequisites are the log ENCODING and the log DESTINATION. Caddy
# writes JSON whenever stderr is not an interactive terminal, which is the
# container default, so `| json` parses its LOG records. Zap's production
# encoder writes the level lowercase, so `level="error"` and never
# `level="ERROR"`. A global `log` block that sends the default logger to a file
# takes these lines off stderr, and then nothing in this file matches,
# whatever is failing: leave the default logger on stderr, or tail that file
# with your collector. CaddyReloadRejected needs the log destination but not
# the encoding, because it selects the raw message. CaddyStartupFailed's
# description says which of its causes reach stderr, and in which form, on
# which Caddy version.
#
# Detection from OUTSIDE the container is still worth keeping for certificates,
# and it is not redundant with CaddyCertManagementFailing: a TLS prober against
# the served site (blackbox_exporter's probe_ssl_earliest_cert_expiry) catches
# the case that logs nothing: a certificate certmagic does not manage, such as
# one loaded from files with `tls <cert> <key>`, which is never renewed and
# never reported.
#
# Thresholds, `for:` windows, and the severity labels are starting points;
# adjust them to your deployment. The `container` selector is whatever your
# log collector sets (Grafana Alloy's Docker log discovery sets `container`
# with no configuration; Promtail and others may key on `job` or `service`
# instead).
groups:
  - name: caddy
    rules:
      # Grouped by subject so that one certificate's success cannot hide another's
      # failure. certmagic names the subject in an `identifier` or `subject` field,
      # except on `job failed` and the retry loop's `will retry` and `final attempt;
      # giving up`, which carry it only at the start of their `error` text
      # (`[name] ...` or `name: obtaining certificate: ...`), so the first
      # label_format reads it from there. A failure whose subject cannot be read
      # gets an empty subject, which no success matches, so it still fires. The
      # drop stage counts a line the log driver cut short instead of failing the query.
      - alert: CaddyCertManagementFailing
        expr: |
          sum by (container, subject) (count_over_time(
            {container="caddy"} |= `"logger":"tls` != "context canceled" | json
            | level="error"
            | logger=~"tls\\.(obtain|renew)" or (logger="tls" and msg=~"job failed|initiating certificate management")
            | label_format error_subject=`{{ regexReplaceAll "(?s)^(?:\\[([^\\] ]+)\\] |([^ :\\[]+): \\w+ certificate: )?.*" .error "$1$2" }}`
            | label_format subject=`{{ or .identifier .subject .error_subject }}`
            | drop __error__, __error_details__
            [1h]
          ))
          unless on (container, subject)
          sum by (container, subject) (count_over_time(
            {container="caddy"} |~ `certificate (obtained|renewed) successfully`
            | json logger="logger", subject="identifier"
            | logger=~"tls\\.(obtain|renew)"
            [1h]
          ))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Caddy is failing to get or renew a certificate"
          description: >
            Caddy logged a certificate failure for a subject in the last hour,
            logged no success for that subject in the same hour, and that has
            held for 15 minutes. The failures are certmagic's ERROR lines under
            `tls.obtain` (a first issuance) and `tls.renew` (a renewal), such
            as `could not get certificate from issuer` and `will retry`, plus
            `job failed` and `initiating certificate management` on the base
            `tls` logger. The successes are `certificate obtained successfully`
            and `certificate renewed successfully`. The rule compares failures
            with successes instead of counting lines, so the number of issuers
            and the number of lines one attempt logs do not change when it
            fires. A retry that succeeds within 15 minutes stays quiet, a
            failure that persists fires and stays firing until that subject
            logs a success or its last failure is an hour old, and one subject
            renewing does not cancel another subject's failure. A subject that
            renewed earlier in the hour and then starts failing is reported
            once that success is an hour old.
            Read the `error` field for the cause: an issuer that refused the
            order or could not be reached, a rejected DNS-01 credential (the
            Cloudflare API token for a `dns cloudflare` site), the `/data`
            volume (`failed storage check` when it cannot be written, a
            `caching certificate` error when a stored certificate cannot be
            read), or a lock. Inside a retry loop (a first issuance, or a
            renewal Caddy starts at boot for a certificate that is already due)
            every attempt after the first goes to the ACME issuer's TEST
            endpoint when it has one (Let's Encrypt staging while the CA is
            left at its default, or an explicit `test_ca`), and an order that
            succeeds there and is then refused in production ENDS the retries,
            so read the `error` field before you check the volume. On a renewal
            the served certificate stays valid until it expires, so this fires
            while HTTPS still works. A
            certificate certmagic does not MANAGE is never renewed and logs
            nothing, so no log rule can see it; an external TLS prober
            (blackbox_exporter's probe_ssl_earliest_cert_expiry) covers that
            case. Lines carrying `context canceled` are excluded because a
            successful config load cancels the outgoing config's context,
            which ends any certificate job that config had in flight, and the
            new config starts its own; an opted-in `--watch` can reload after
            its 1-second poll.
      - alert: CaddyCrowdSecLAPIPollFailed
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"} | json
            | logger="crowdsec" | level="error" [10m]
          )) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec bouncer is logging LAPI errors"
          description: >
            The bouncer logged more than 2 errors in 10 minutes. Under the
            default streaming bouncer it logs one ERROR line per failed poll,
            and the cadence depends on whether a stream was ever established;
            under `disable_streaming` the line is per REQUEST instead, so the
            cadence follows traffic rather than the ticker. An established
            stream polls every 60s
            by default, so a LAPI that starts failing reaches the threshold of
            2 in about 2 to 3 minutes. A LAPI unreachable from startup is retried
            on a 10s delay, so the third ERROR arrives about 20 seconds in when
            the connect fails fast (a refused connection or a DNS failure
            returns immediately, leaving only the two retry delays) and about
            50 seconds in when the LAPI is blackholed, because each attempt also
            spends its own 10s deadline before the delay starts. One lost poll
            on an established stream stays quiet. The selector is the log LEVEL
            under the `crowdsec` logger rather than a message, because the failed
            poll logs the raw transport error and has no stable string; any other
            repeating bouncer error trips the same rule, so read the line. This
            rule needs no Caddyfile option at all, which is what makes it the
            detector for a deployment that leaves `enable_caddy_metrics` off;
            where it is set, CaddyCrowdSecLAPIFailing reports the same outage as
            a rate. With `enable_hard_fails` set the bouncer logs at FATAL and
            exits instead, so the container restart is the signal there, not
            this rule. Consequences for enforcement are the ones
            CaddyCrowdSecLAPIFailing describes. Check the CrowdSec LAPI and the
            bouncer's `api_url` and `api_key`.
      - alert: CaddyConfigWatcherStopped
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"} |= "unable to load latest config"
            | json | logger="watcher" [1h]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Caddy stopped watching its config file"
          description: >
            Caddy logged `unable to load latest config` under the `watcher`
            logger, so an opted-in `--watch` could not READ or ADAPT the
            current config file and the poller stopped for the life of the
            process. Read the structured `error` field for which arm it was:
            `reading config from file:` is a missing or unreadable file,
            `adapting config using caddyfile:` is a Caddyfile that does not
            parse, and `config is not valid JSON:` is a JSON config watched
            without `--adapter`. Different repairs, same dead watcher. A
            REPLACED file is none of them and this rule cannot see it: with the
            config DIRECTORY mounted, a rename is read cleanly on the next poll,
            and with the single FILE bind-mounted the mount pins the inode, so
            the poller keeps reading the old bytes and logs nothing at all.
            Mount the directory, or save in place. The running config is the
            last good one and keeps serving,
            later valid edits are ignored, and no other surface reports it:
            `caddy_config_last_reload_successful` stays 1 because no in-process
            load was attempted, and the container stays healthy. Recovery is a
            container restart once the file is readable and valid again; an
            explicit reload applies the current file without reviving the
            watcher. This selects the string, not the level: the watcher also
            logs `applying latest config` at ERROR when a good file fails to
            LOAD, and that arm keeps polling and moves the gauge, so
            CaddyConfigReloadFailed is the signal for it. The line is logged
            once, so this alert reports the transition and clears when the
            window passes even though the condition does not; lengthen the
            window if you want it to sit longer. Deployments that do not
            override the image CMD never arm the watcher and never see this.

      - alert: CaddyReloadRejected
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"} |= "failed to reload config from file" [1h]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Caddy rejected a config reload it was asked for"
          description: >
            A SIGUSR1 reload was refused, so the running config is the previous
            one and the file on disk is not live. Read the structured `error`
            field for which arm it was: `reading config from file:` is a missing
            or unreadable file, `adapting config using caddyfile:` is a Caddyfile
            that does not parse, and a `loading new config` cause is a config
            that read and adapted and then failed to apply. The first two leave
            `caddy_config_last_reload_successful` at 1, because no in-process
            load is attempted, so this rule is the only signal for them; the
            third moves that gauge too, so CaddyConfigReloadFailed fires
            alongside this rule there. This is the reload path a deployment on
            the image's own CMD has, and the one arm the other config rules do
            not reach: CaddyConfigWatcherStopped needs an opted-in `--watch`,
            and CaddyStartupFailed only sees a failure at process start. The
            proxy keeps serving the last good config and the healthcheck stays
            green throughout. The line carries no `logger` field, because Caddy
            reports it on the DEFAULT logger, which is why this rule selects the
            message rather than a logger; it still shares the log-DESTINATION
            prerequisite of the other log rules, so a global `log` block that
            sends the default logger to a file takes it off stderr too. The line
            is logged once per signal, so this reports the transition and clears
            when the window passes. Recovery is to fix the file and send the
            signal again; `caddy validate --adapter caddyfile --config <file>`
            reaches the first two causes before you send it. A `caddy reload`
            through `docker exec` is not covered here and does not need to be:
            it reports the same failure as its own exit status.

      # No `| json` stage, deliberately: the first alternative is a plain-text
      # line that a `| json` stage would tag with a parse error, which fails the
      # metric query. It is what Caddy v2.11.4 and earlier print for every
      # startup cause, and keeping it lets one rule serve an image on either
      # side of v2.11.5. The second alternative is the JSON record later
      # versions print instead. Anchoring it on `"msg":"` keeps it off the
      # reload and watcher records, which carry the same cause text in their
      # `error` field while Caddy keeps serving.
      - alert: CaddyStartupFailed
        expr: |
          sum by (container) (count_over_time(
            {container="caddy"}
            |~ `^Error: |"msg":"(reading config from file|adapting config using [^:"]+|loading initial config): `
            [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Caddy exited during startup"
          description: >
            Caddy exited before it served anything, so nothing is being served at
            all and no metric series exists to report it: the process ends before
            the admin endpoint or a `metrics` listener binds. Read the cause.
            `adapting config using caddyfile:` is a Caddyfile that does not parse.
            `reading config from file:` is a missing or unreadable file, which
            with a single-file bind mount also means the mount source does not
            exist. `loading initial config:` is a config that read and adapted
            and then failed to apply, so the cause is a module that would not
            provision (a rejected credential, for instance) or an address already
            in use. `caddy validate --adapter caddyfile --config <file>` reaches
            the first two and the provisioning half of the third, never an
            address conflict. With `restart: unless-stopped` the container loops
            and the line repeats on every attempt.
            How the cause reaches the log depends on the Caddy version. Up to
            v2.11.4 the CLI prints it itself as a plain-text `Error: <cause>`
            line on stderr, for all three causes and whatever the Caddyfile's
            `log` block says. From v2.11.5 the CLI writes it through Caddy's own
            logger instead, as an `error` record whose `msg` is the cause, and
            two things follow (caddyserver/caddy#7962). The read and adapt
            causes are written into a startup buffer that nothing flushes, so
            they are never printed: the container exits with status 1 after its
            startup INFO lines and this rule cannot see it, which leaves the
            restart loop as the only signal. The load cause is printed, but
            wherever and however the Caddyfile's default logger writes, so it
            reaches this rule only with the default logger left on stderr in
            JSON, the prerequisite the other log rules share.

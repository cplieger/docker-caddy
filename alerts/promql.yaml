# Recommended PromQL alert rules for docker-caddy, for Prometheus or the
# Mimir ruler. Scrape Caddy's metrics and load this file into your ruler.
# Firing alerts go through your Alertmanager.
# Thresholds, windows and severity labels are starting points. Your scrape
# job label is left out of the selectors that read Caddy's own metrics. The
# reachability pair reads the synthetic up series and needs it.
# docs/monitoring.md states what each rule needs.
# Complementary to alerts/logql.yaml, which is for Loki's ruler: load both.
# docs/monitoring.md names the alerts that overlap when Caddy's metrics are on.
groups:
  - name: caddy
    rules:
      - alert: CaddyTargetDown
        expr: up{job="caddy"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Caddy is not being scraped successfully"
          description: >
            Prometheus has not scraped Caddy successfully for 15 minutes, so
            Caddy is down or unreachable and every Caddy metric rule is blind.
            Check the container and the network path from the scraper.
      - alert: CaddyTargetAbsent
        expr: absent(up{job="caddy"})
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Caddy has no scrape target at all"
          description: >
            No `up{job="caddy"}` series exists, so Caddy is not a configured
            target. The target or its scrape config is gone, or the `job`
            matcher does not name your scrape job. Check your scrape config and
            both reachability rules.
      - alert: CaddyUpstreamUnhealthy
        expr: caddy_reverse_proxy_upstreams_healthy == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Caddy upstream {{ $labels.upstream }} unhealthy"
          description: >
            Caddy has reported {{ $labels.upstream }} as down for more than 5
            minutes, so the service behind it is likely failing. Check the
            backend container.
      - alert: CaddyConfigReloadFailed
        expr: caddy_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Caddy config reload failed"
          description: >
            Caddy tried to apply a new config and rejected it, so it still
            serves the previous one. Run `caddy validate` on the config, or read
            the Caddy log for the error.
      - alert: CaddyHigh5xxRate
        expr: >
          sum without (server, code, method) (rate(caddy_http_request_duration_seconds_count{code=~"5.."}[5m]))
          / sum without (server, code, method) (rate(caddy_http_request_duration_seconds_count[5m])) > 0.05
          and ignoring(handler, host)
          sum without (server, handler, code, method, host) (rate(caddy_http_request_duration_seconds_count[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Caddy 5xx rate >5% on handler {{ $labels.handler }}"
          description: >
            More than 5% of requests to the {{ $labels.handler }} handler
            returned 5xx for 10 minutes, while Caddy carried over 1 request per
            second. An upstream is likely failing, or a route is broken. Check
            CaddyUpstreamUnhealthy and the backend logs.
      - alert: CaddyCrowdSecLAPIFailing
        expr: >
          rate(crowdsec_bouncer_lapi_requests_failures_total{mode="stream"}[10m])
          / rate(crowdsec_bouncer_lapi_requests_total{mode="stream"}[10m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec bouncer cannot reach the LAPI"
          description: >
            More than half of the CrowdSec bouncer's LAPI polls have failed for
            5 minutes, so it learns no new decisions and enforces at most its
            cached ones. Check the CrowdSec LAPI and the bouncer's `api_url` and
            `api_key`.
      # Caddy counts an admin request only once its handler returns, and the
      # image's healthcheck reads /config/ every 30 seconds, under the lock a
      # reload holds. Five minutes spans ten probes, so a late probe or a slow
      # scrape cannot empty the window, and the window is the only wait. A
      # missing series never fires, and the second arm drops a series a failed
      # scrape has marked stale, which CaddyTargetDown reports.
      - alert: CaddyAdminAPIStalled
        expr: >
          sum without (code, method) (increase(caddy_admin_http_requests_total{path="/config/"}[5m])) == 0
          and sum without (code, method) (caddy_admin_http_requests_total{path="/config/"})
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Caddy's admin API is stalled, so reloads no longer apply"
          description: >
            No admin API request to /config/ has completed for 5 minutes, so
            config reads and reloads stop applying while sites keep serving. The
            image's default healthcheck sends that request. Read the admin API
            goroutine dump for the reload holding the lock, as the Admin API
            stall section of docs/monitoring.md shows.
